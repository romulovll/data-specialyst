<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCP Cloud Architect — Study Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root{--bg-primary:#0a0e17;--bg-secondary:#111827;--bg-tertiary:#1f2937;--accent-primary:#f59e0b;--accent-secondary:#f97316;--accent-gradient:linear-gradient(135deg,#f59e0b,#f97316);--status-complete:#10b981;--status-in-progress:#f59e0b;--status-planned:#6b7280;--text-primary:#f9fafb;--text-secondary:#9ca3af;--text-muted:#6b7280;--border-subtle:#1f2937;--font-body:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono','Fira Code',monospace}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased}
    .app{display:flex;min-height:100vh}
    .sidebar{width:280px;background:var(--bg-secondary);border-right:1px solid var(--border-subtle);position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:50}
    .sidebar__header{padding:1.25rem;border-bottom:1px solid var(--border-subtle)}
    .sidebar__title{font-size:.95rem;font-weight:700}.sidebar__subtitle{font-size:.75rem;color:var(--text-muted);font-family:var(--font-mono)}
    .sidebar__progress{margin-top:.75rem}.sidebar__progress-text{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-muted);margin-bottom:.35rem;font-family:var(--font-mono)}
    .sidebar__progress-bar{height:6px;background:var(--bg-tertiary);border-radius:3px;overflow:hidden}.sidebar__progress-fill{height:100%;background:var(--accent-gradient);border-radius:3px;transition:width .5s ease}
    .sidebar__nav{padding:.75rem 0}.sidebar__section-title{font-size:.65rem;font-family:var(--font-mono);color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;padding:.75rem 1.25rem .35rem}
    .sidebar__link{display:flex;align-items:center;gap:.6rem;padding:.5rem 1.25rem;color:var(--text-secondary);text-decoration:none;font-size:.8rem;transition:all .2s;border-left:2px solid transparent;cursor:pointer;background:none;border-right:none;border-top:none;border-bottom:none;width:100%;text-align:left}
    .sidebar__link:hover{color:var(--text-primary);background:rgba(245,158,11,.05)}.sidebar__link.active{color:var(--accent-primary);border-left-color:var(--accent-primary);background:rgba(245,158,11,.08)}
    .sidebar__link-dot{width:6px;height:6px;border-radius:50%;background:var(--status-planned);flex-shrink:0}.sidebar__link-dot--done{background:var(--status-complete)}.sidebar__link-dot--active{background:var(--status-in-progress)}
    .sidebar__link-count{margin-left:auto;font-family:var(--font-mono);font-size:.65rem;color:var(--text-muted)}
    .sidebar__footer{padding:1rem 1.25rem;border-top:1px solid var(--border-subtle);font-size:.8rem}.sidebar__footer a{color:var(--accent-primary);text-decoration:none}
    .sidebar-toggle{display:none;position:fixed;bottom:1.5rem;right:1.5rem;z-index:60;width:48px;height:48px;border-radius:50%;background:var(--accent-gradient);border:none;color:var(--bg-primary);font-size:1.2rem;cursor:pointer;box-shadow:0 4px 15px rgba(245,158,11,.3);align-items:center;justify-content:center}
    .main{margin-left:280px;flex:1;min-width:0}
    .main__header{position:sticky;top:0;z-index:40;background:rgba(10,14,23,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between}
    .main__header h1{font-size:1.1rem;font-weight:600}.main__header-actions{display:flex;gap:.75rem}
    .main__header-btn{font-family:var(--font-mono);font-size:.75rem;padding:.4rem .75rem;border-radius:6px;border:1px solid var(--border-subtle);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;transition:all .2s}
    .main__header-btn:hover{border-color:var(--accent-primary);color:var(--text-primary)}
    .content{padding:2rem;max-width:900px}
    .study-section__title{font-size:1.5rem;font-weight:700;margin-bottom:.5rem;background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
    .study-section__desc{color:var(--text-muted);font-size:.9rem;margin-bottom:2rem}
    .study-card{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:12px;margin-bottom:1.5rem;overflow:hidden}
    .study-card__header{padding:1.25rem 1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .2s}
    .study-card__header:hover{background:rgba(245,158,11,.03)}.study-card__header-left{display:flex;align-items:center;gap:.75rem}
    .study-card__checkbox{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--border-subtle);border-radius:4px;cursor:pointer;position:relative;flex-shrink:0;transition:all .2s}
    .study-card__checkbox:checked{background:var(--status-complete);border-color:var(--status-complete)}
    .study-card__checkbox:checked::after{content:'\2713';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:.75rem;font-weight:700}
    .study-card__name{font-size:.95rem;font-weight:600}.study-card.checked .study-card__name{color:var(--status-complete);text-decoration:line-through;opacity:.7}
    .study-card__arrow{color:var(--text-muted);font-size:.8rem;transition:transform .3s}.study-card.open .study-card__arrow{transform:rotate(180deg)}
    .study-card__body{display:none;padding:0 1.5rem 1.5rem;border-top:1px solid var(--border-subtle)}.study-card.open .study-card__body{display:block}
    .study-card__body h3{font-size:.9rem;font-weight:600;color:var(--accent-primary);margin:1.25rem 0 .5rem}.study-card__body h3:first-child{margin-top:1rem}
    .study-card__body p{color:var(--text-secondary);font-size:.85rem;line-height:1.7;margin-bottom:.5rem}
    .study-card__body ul{list-style:none;margin-bottom:.75rem}.study-card__body ul li{color:var(--text-secondary);font-size:.85rem;line-height:1.6;padding-left:1rem;position:relative;margin-bottom:.3rem}
    .study-card__body ul li::before{content:'';position:absolute;left:0;top:.55rem;width:4px;height:4px;border-radius:50%;background:var(--accent-primary)}
    .study-card__body strong{color:var(--text-primary)}.study-card__body a{color:var(--accent-primary);text-decoration:none}.study-card__body a:hover{text-decoration:underline}
    .study-table{width:100%;border-collapse:collapse;margin:.75rem 0;font-size:.8rem}
    .study-table th{text-align:left;padding:.5rem .75rem;background:var(--bg-tertiary);color:var(--accent-primary);font-family:var(--font-mono);font-weight:500;font-size:.75rem;border-bottom:1px solid var(--border-subtle)}
    .study-table td{padding:.5rem .75rem;color:var(--text-secondary);border-bottom:1px solid rgba(31,41,55,.5)}
    .exam-tip{background:rgba(245,158,11,.08);border-left:3px solid var(--status-in-progress);border-radius:0 8px 8px 0;padding:.75rem 1rem;margin:.75rem 0;font-size:.8rem}
    .exam-tip__label{font-family:var(--font-mono);font-size:.7rem;color:var(--status-in-progress);text-transform:uppercase;margin-bottom:.25rem}.exam-tip p{color:var(--text-secondary);margin:0}
    .resource-link{display:inline-flex;align-items:center;gap:.4rem;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:6px;padding:.3rem .7rem;font-size:.75rem;color:var(--accent-primary);text-decoration:none;margin:.2rem;transition:all .2s}
    .resource-link:hover{border-color:var(--accent-primary);transform:translateY(-1px);text-decoration:none}
    .path-indicator{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:10px;padding:1rem 1.25rem;margin-bottom:2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
    .path-step{display:flex;align-items:center;gap:.5rem;font-size:.8rem}
    .path-step__dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.7rem;font-weight:700}
    .path-step--active .path-step__dot{background:var(--accent-gradient);color:var(--bg-primary)}.path-step--next .path-step__dot{background:var(--bg-tertiary);color:var(--text-muted);border:1px solid var(--border-subtle)}
    .path-step--active .path-step__label{color:var(--text-primary);font-weight:600}.path-step--next .path-step__label{color:var(--text-muted)}
    .path-arrow{color:var(--text-muted);font-size:.8rem}
    @media(max-width:768px){.sidebar{transform:translateX(-100%);transition:transform .3s}.sidebar.open{transform:translateX(0)}.sidebar-toggle{display:flex}.main{margin-left:0}.content{padding:1.5rem 1rem}}
  </style>
</head>

  <div class="main">
    <header class="main__header"><h1 id="sectionTitle">Designing Solutions</h1><div class="main__header-actions"><button class="main__header-btn" id="expandAll">Expand All</button><button class="main__header-btn" id="collapseAll">Collapse All</button></div></header>

        <div class="path-step path-step--active"><div class="path-step__dot">1</div><span class="path-step__label">GCP Cloud Architect</span></div><span class="path-arrow">&rarr;</span>
        <div class="path-step path-step--next"><div class="path-step__dot">2</div><span class="path-step__label">GCP Data Engineer</span></div><span class="path-arrow">&rarr;</span>
        <div class="path-step path-step--next"><div class="path-step__dot">3</div><span class="path-step__label">AI Reference</span></div>

<script>
(function(){
'use strict';
var data={
  design:{title:'Designing Cloud Solutions (24%)',description:'The heaviest domain. How to design solutions that meet business and technical requirements.',cards:[
    {id:'pca-waf',name:'Well-Architected Framework (6 Pillars)',content:'<h3>The foundation of every exam question</h3><table class="study-table"><thead><tr><th>Pillar</th><th>Key question</th><th>GCP tools</th></tr></thead><tbody><tr><td><strong>Operational Excellence</strong></td><td>Can you run and monitor it?</td><td>Cloud Monitoring, Logging, Error Reporting</td></tr><tr><td><strong>Security</strong></td><td>Is it protected?</td><td>IAM, VPC-SC, Cloud KMS, DLP</td></tr><tr><td><strong>Reliability</strong></td><td>Does it recover from failures?</td><td>Multi-region, load balancing, health checks</td></tr><tr><td><strong>Performance</strong></td><td>Does it scale and perform?</td><td>CDN, autoscaling, caching</td></tr><tr><td><strong>Cost Optimization</strong></td><td>Are you spending wisely?</td><td>Committed use, preemptible, rightsizing</td></tr><tr><td><strong>Sustainability</strong></td><td>Is it efficient?</td><td>Region selection, serverless</td></tr></tbody></table><div class="exam-tip"><div class="exam-tip__label">Exam Key</div><p>Every question implicitly tests one or more pillars. Read the qualifier word: "most secure" = security pillar, "most cost-effective" = cost pillar, "minimum downtime" = reliability pillar.</p></div><a class="resource-link" href="https://cloud.google.com/architecture/framework" target="_blank">Well-Architected Framework</a>'},
    {id:'pca-design-patterns',name:'Solution Design Patterns',content:'<h3>Common patterns the exam tests</h3><table class="study-table"><thead><tr><th>Pattern</th><th>When</th><th>GCP Implementation</th></tr></thead><tbody><tr><td><strong>Microservices</strong></td><td>Independent scaling, team autonomy</td><td>GKE, Cloud Run, Pub/Sub</td></tr><tr><td><strong>Event-driven</strong></td><td>Async processing, decoupling</td><td>Pub/Sub, Cloud Functions, Eventarc</td></tr><tr><td><strong>API Gateway</strong></td><td>Expose services securely</td><td>API Gateway, Apigee</td></tr><tr><td><strong>CQRS</strong></td><td>Separate read/write models</td><td>Cloud SQL (write) + BigQuery (read)</td></tr><tr><td><strong>Strangler fig</strong></td><td>Gradual migration from monolith</td><td>Load balancer routing + new services</td></tr></tbody></table>'},
    {id:'pca-multi-tier',name:'Multi-Tier Architecture on GCP',content:'<h3>Standard 3-tier architecture</h3><ul><li><strong>Presentation tier:</strong> Cloud CDN + Load Balancer + Cloud Run/GKE</li><li><strong>Application tier:</strong> GKE / Cloud Run / Compute Engine (MIG)</li><li><strong>Data tier:</strong> Cloud SQL / Spanner / Firestore / BigQuery</li></ul><h3>Key decisions</h3><ul><li>Stateless app tier = easier scaling (store state in Redis/Memorystore)</li><li>Internal load balancer between app and data tiers</li><li>External HTTPS load balancer for the presentation tier</li><li>Cloud Armor for DDoS and WAF protection</li></ul>'},
    {id:'pca-hybrid',name:'Hybrid & Multi-Cloud Architecture',content:'<h3>Connectivity options</h3><table class="study-table"><thead><tr><th>Option</th><th>Bandwidth</th><th>Cost</th><th>Use case</th></tr></thead><tbody><tr><td><strong>Cloud VPN</strong></td><td>Up to 3 Gbps</td><td>$</td><td>Dev/test, small workloads</td></tr><tr><td><strong>Dedicated Interconnect</strong></td><td>10-200 Gbps</td><td>$$$</td><td>High bandwidth, production</td></tr><tr><td><strong>Partner Interconnect</strong></td><td>50 Mbps-50 Gbps</td><td>$$</td><td>When DC not near Google PoP</td></tr><tr><td><strong>Cross-Cloud Interconnect</strong></td><td>10-100 Gbps</td><td>$$$</td><td>GCP to AWS/Azure</td></tr></tbody></table><h3>Hybrid platforms</h3><ul><li><strong>Anthos:</strong> Run GKE on-prem, AWS, Azure — consistent management</li><li><strong>Apigee:</strong> API management across hybrid environments</li></ul><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"On-prem to GCP, high bandwidth, production" &rarr; <strong>Dedicated Interconnect</strong>. "Small/dev workloads" &rarr; <strong>Cloud VPN</strong>.</p></div>'}
  ]},
  compute:{title:'Compute Services',description:'Know when to use each compute option — heavily tested.',cards:[
    {id:'pca-compute-decision',name:'Compute Decision Matrix',content:'<table class="study-table"><thead><tr><th>Need</th><th>Service</th><th>Why</th></tr></thead><tbody><tr><td>Full VM control, custom OS</td><td><strong>Compute Engine</strong></td><td>IaaS, max flexibility</td></tr><tr><td>Containers at scale, microservices</td><td><strong>GKE</strong></td><td>Managed Kubernetes</td></tr><tr><td>Containers, no cluster management</td><td><strong>Cloud Run</strong></td><td>Serverless containers</td></tr><tr><td>Simple web apps, auto-managed</td><td><strong>App Engine</strong></td><td>PaaS, zero infra</td></tr><tr><td>Event-driven functions</td><td><strong>Cloud Functions</strong></td><td>FaaS, pay per invocation</td></tr></tbody></table><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"Minimum operational overhead" + containers &rarr; <strong>Cloud Run</strong>. "Existing Kubernetes" &rarr; <strong>GKE</strong>. "Lift and shift VMs" &rarr; <strong>Compute Engine</strong>.</p></div>'},
    {id:'pca-gke',name:'GKE (Google Kubernetes Engine)',content:'<h3>Key concepts for the exam</h3><ul><li><strong>Autopilot vs Standard:</strong> Autopilot = Google manages nodes (less control, less ops). Standard = you manage node pools.</li><li><strong>Node pools:</strong> Group of nodes with same config. Use different pools for different workloads.</li><li><strong>Autoscaling:</strong> HPA (horizontal pod), VPA (vertical pod), Cluster Autoscaler (nodes)</li><li><strong>Workload Identity:</strong> Best way to give pods access to GCP services (no key files)</li><li><strong>Network policies:</strong> Control pod-to-pod traffic</li><li><strong>Private clusters:</strong> Nodes have internal IPs only — more secure</li></ul><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"Minimum ops for Kubernetes" &rarr; <strong>GKE Autopilot</strong>. "Pod access to BigQuery" &rarr; <strong>Workload Identity</strong>.</p></div>'},
    {id:'pca-cloudrun',name:'Cloud Run & App Engine',content:'<h3>Cloud Run</h3><ul><li>Serverless containers — scales to zero</li><li>Pay only when handling requests</li><li>Max concurrency per instance (configurable)</li><li>Supports any language/runtime (Docker)</li><li>Can connect to VPC via Serverless VPC Access</li></ul><h3>App Engine</h3><ul><li><strong>Standard:</strong> Sandboxed, scales to zero, limited runtimes</li><li><strong>Flexible:</strong> Custom runtimes (Docker), doesn\'t scale to zero</li></ul><h3>When to use which</h3><ul><li>New projects → <strong>Cloud Run</strong> (more flexible, modern)</li><li>Legacy apps on App Engine → keep there unless migrating</li><li>Need scale-to-zero + custom container → <strong>Cloud Run</strong></li></ul>'},
    {id:'pca-ce',name:'Compute Engine Deep Dive',content:'<h3>Key exam topics</h3><ul><li><strong>Machine types:</strong> General (E2, N2), Compute-optimized (C2), Memory (M2), Accelerator (A2/GPU)</li><li><strong>Managed Instance Groups (MIG):</strong> Autoscaling, auto-healing, rolling updates</li><li><strong>Preemptible/Spot VMs:</strong> Up to 91% cheaper, can be terminated anytime</li><li><strong>Sole-tenant nodes:</strong> Physical isolation for compliance</li><li><strong>Custom images:</strong> Golden images for consistent deployments</li><li><strong>Live migration:</strong> VMs move during host maintenance (default, no downtime)</li></ul><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"Compliance requires physical isolation" &rarr; <strong>Sole-tenant nodes</strong>. "Reduce cost for fault-tolerant batch" &rarr; <strong>Spot VMs</strong>.</p></div>'}
  ]},
  networking:{title:'Networking & Hybrid',description:'VPC design, load balancing, DNS — often the trickiest exam questions.',cards:[
    {id:'pca-vpc',name:'VPC Design',content:'<h3>Key concepts</h3><ul><li><strong>VPC:</strong> Global resource. Subnets are regional.</li><li><strong>Shared VPC:</strong> One host project, multiple service projects share the network. Best for org-wide networking.</li><li><strong>VPC Peering:</strong> Connect two VPCs. Non-transitive (A&harr;B, B&harr;C does NOT mean A&harr;C).</li><li><strong>Private Google Access:</strong> VMs without external IPs can reach Google APIs.</li><li><strong>Private Service Connect:</strong> Private endpoints for Google services in your VPC.</li><li><strong>Firewall rules:</strong> Stateful, priority-based (lower number = higher priority). Default deny ingress, allow egress.</li></ul><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"Multiple projects need shared network" &rarr; <strong>Shared VPC</strong>. "Connect two VPCs in different orgs" &rarr; <strong>VPC Peering</strong>.</p></div>'},
    {id:'pca-lb',name:'Load Balancing',content:'<h3>Load balancer decision tree</h3><table class="study-table"><thead><tr><th>Traffic</th><th>Scope</th><th>Load Balancer</th></tr></thead><tbody><tr><td>HTTP(S)</td><td>Global</td><td><strong>Global External Application LB</strong></td></tr><tr><td>HTTP(S)</td><td>Regional</td><td><strong>Regional External Application LB</strong></td></tr><tr><td>HTTP(S)</td><td>Internal</td><td><strong>Internal Application LB</strong></td></tr><tr><td>TCP/UDP</td><td>Global</td><td><strong>External Proxy Network LB</strong></td></tr><tr><td>TCP/UDP</td><td>Regional</td><td><strong>External Passthrough Network LB</strong></td></tr><tr><td>TCP/UDP</td><td>Internal</td><td><strong>Internal Passthrough Network LB</strong></td></tr></tbody></table><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"Global HTTP traffic with CDN" &rarr; <strong>Global External Application LB</strong>. "Internal microservices" &rarr; <strong>Internal Application LB</strong>.</p></div>'},
    {id:'pca-dns',name:'Cloud DNS & CDN',content:'<h3>Cloud DNS</h3><ul><li>Managed authoritative DNS service</li><li>Private zones: DNS resolution only within your VPC</li><li>DNS peering: share DNS across VPCs</li></ul><h3>Cloud CDN</h3><ul><li>Content caching at Google edge locations</li><li>Works with Global External Application LB</li><li>Cache modes: USE_ORIGIN_HEADERS, CACHE_ALL_STATIC, FORCE_CACHE_ALL</li></ul><h3>Media CDN</h3><ul><li>For large-scale video/media streaming (like Helicopter Racing League case study)</li></ul>'}
  ]},
  security:{title:'Security & Compliance (18%)',description:'Third heaviest domain. IAM, encryption, org policies, compliance.',cards:[
    {id:'pca-iam-deep',name:'IAM Architecture',content:'<h3>Resource hierarchy</h3><ul><li><strong>Organization</strong> &rarr; <strong>Folders</strong> &rarr; <strong>Projects</strong> &rarr; <strong>Resources</strong></li><li>IAM policies <strong>inherit downward</strong> — org policy applies to all projects</li><li>More restrictive policies at lower levels add constraints, never remove parent permissions</li></ul><h3>Key IAM concepts</h3><ul><li><strong>Service accounts:</strong> For applications, not humans. Use Workload Identity for GKE.</li><li><strong>Organization policies:</strong> Guardrails (e.g., "no external IPs on VMs", "restrict regions")</li><li><strong>Conditions:</strong> Grant roles based on resource attributes (tags, time)</li><li><strong>Groups:</strong> Always grant roles to groups, not individual users</li></ul><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"Prevent VMs from having external IPs" &rarr; <strong>Organization policy constraint</strong>. "Cross-project service auth" &rarr; <strong>Service account with Workload Identity</strong>.</p></div>'},
    {id:'pca-encryption',name:'Encryption & Key Management',content:'<table class="study-table"><thead><tr><th>Level</th><th>Who manages</th><th>Where stored</th></tr></thead><tbody><tr><td><strong>Default (GMEK)</strong></td><td>Google</td><td>Google infra</td></tr><tr><td><strong>CMEK</strong></td><td>Customer</td><td>Cloud KMS</td></tr><tr><td><strong>CSEK</strong></td><td>Customer</td><td>Customer infra</td></tr><tr><td><strong>Cloud HSM</strong></td><td>Customer</td><td>Hardware module in GCP</td></tr><tr><td><strong>Cloud EKM</strong></td><td>Customer</td><td>External key manager</td></tr></tbody></table><ul><li><strong>Cloud KMS:</strong> Create, rotate, and manage encryption keys</li><li><strong>Cloud HSM:</strong> FIPS 140-2 Level 3 certified hardware</li><li><strong>Cloud EKM:</strong> Keys stored outside Google (Thales, Fortanix)</li></ul>'},
    {id:'pca-compliance',name:'Compliance & Cloud Armor',content:'<h3>Compliance controls</h3><ul><li><strong>VPC Service Controls:</strong> Prevent data exfiltration</li><li><strong>Access Transparency:</strong> See when Google accesses your data</li><li><strong>Assured Workloads:</strong> Compliance controls for regulated industries (FedRAMP, HIPAA)</li><li><strong>Organization policies:</strong> Enforce resource location, disable APIs</li></ul><h3>Cloud Armor</h3><ul><li>DDoS protection at the edge</li><li>WAF rules (OWASP top 10)</li><li>Adaptive Protection (ML-based threat detection)</li><li>Works with Global External Application LB</li></ul><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"HIPAA compliance" &rarr; <strong>Assured Workloads</strong> + <strong>VPC-SC</strong> + <strong>CMEK</strong>. "DDoS protection" &rarr; <strong>Cloud Armor</strong>.</p></div>'},
    {id:'pca-identity',name:'Identity & Access',content:'<h3>Identity options</h3><table class="study-table"><thead><tr><th>Scenario</th><th>Service</th></tr></thead><tbody><tr><td>Corporate SSO to GCP</td><td><strong>Cloud Identity + SAML/OIDC federation</strong></td></tr><tr><td>User-facing app login</td><td><strong>Identity Platform (Firebase Auth)</strong></td></tr><tr><td>Secure internal apps without VPN</td><td><strong>Identity-Aware Proxy (IAP)</strong></td></tr><tr><td>AWS/Azure workloads accessing GCP</td><td><strong>Workload Identity Federation</strong></td></tr></tbody></table>'}
  ]},
  data:{title:'Data & Storage',description:'You know this well from your data engineering background. Quick review.',cards:[
    {id:'pca-storage-decision',name:'Storage Decision Matrix (Review)',content:'<table class="study-table"><thead><tr><th>Need</th><th>Service</th></tr></thead><tbody><tr><td>SQL analytics at scale</td><td><strong>BigQuery</strong></td></tr><tr><td>Low-latency NoSQL, &gt;1TB</td><td><strong>Bigtable</strong></td></tr><tr><td>Global relational + transactions</td><td><strong>Spanner</strong></td></tr><tr><td>Standard relational, single-region</td><td><strong>Cloud SQL</strong></td></tr><tr><td>Document DB, mobile/web</td><td><strong>Firestore</strong></td></tr><tr><td>Object storage</td><td><strong>Cloud Storage</strong></td></tr><tr><td>In-memory cache</td><td><strong>Memorystore</strong></td></tr></tbody></table><p>You already studied this in the PDE prep — this is a review. The PCA exam tests the <strong>same decisions</strong> but from an architecture perspective (cost, scale, HA).</p>'},
    {id:'pca-data-arch',name:'Data Architecture on GCP',content:'<h3>The PCA adds these data topics</h3><ul><li><strong>BigLake:</strong> Unified storage for data lakes and warehouses</li><li><strong>Dataform:</strong> SQL-based data transformation (like dbt for BigQuery)</li><li><strong>Analytics Hub:</strong> Data sharing and exchange across organizations</li><li><strong>Vertex AI:</strong> ML platform — AutoML, custom training, Feature Store</li><li><strong>Gemini for GCP:</strong> AI-powered operations, code generation</li></ul><div class="exam-tip"><div class="exam-tip__label">Your Advantage</div><p>Data is your strongest area. The PCA tests broader but shallower on data than the PDE. Focus your study time on <strong>compute, networking, and security</strong> instead.</p></div>'}
  ]},
  reliability:{title:'Reliability & DR (14%)',description:'Designing for failure — HA, DR, backups, monitoring.',cards:[
    {id:'pca-ha',name:'High Availability Patterns',content:'<h3>By scope</h3><table class="study-table"><thead><tr><th>Scope</th><th>Pattern</th><th>GCP Implementation</th></tr></thead><tbody><tr><td>Single zone</td><td>Instance redundancy</td><td>MIG with health checks</td></tr><tr><td>Multi-zone (regional)</td><td>Zone failover</td><td>Regional MIG, Cloud SQL HA, regional GKE</td></tr><tr><td>Multi-region (global)</td><td>Region failover</td><td>Global LB, Spanner multi-region, BigQuery multi-region</td></tr></tbody></table><h3>Key services HA capabilities</h3><ul><li><strong>Cloud SQL:</strong> Regional HA (automatic failover to standby in another zone)</li><li><strong>GKE:</strong> Regional clusters (control plane + nodes across zones)</li><li><strong>Spanner:</strong> Multi-region configs for zero-downtime failover</li><li><strong>Cloud Storage:</strong> Multi-region and dual-region buckets</li></ul>'},
    {id:'pca-dr',name:'Disaster Recovery Strategies',content:'<table class="study-table"><thead><tr><th>Strategy</th><th>RPO</th><th>RTO</th><th>Cost</th><th>How</th></tr></thead><tbody><tr><td><strong>Backup & Restore</strong></td><td>Hours</td><td>Hours</td><td>$</td><td>Backups in multi-region GCS</td></tr><tr><td><strong>Pilot Light</strong></td><td>Minutes</td><td>10s of min</td><td>$$</td><td>Minimal resources always running in DR region</td></tr><tr><td><strong>Warm Standby</strong></td><td>Minutes</td><td>Minutes</td><td>$$$</td><td>Scaled-down copy in DR region</td></tr><tr><td><strong>Hot Standby</strong></td><td>Seconds</td><td>Seconds</td><td>$$$$</td><td>Full copy, active-active with global LB</td></tr></tbody></table><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"Minimum cost DR" &rarr; <strong>Backup & Restore</strong>. "Near-zero downtime" &rarr; <strong>Hot Standby with global LB</strong>. Match RPO/RTO requirements to the cheapest strategy that meets them.</p></div>'},
    {id:'pca-monitoring',name:'Monitoring & Observability',content:'<h3>The observability stack</h3><table class="study-table"><thead><tr><th>Service</th><th>What it does</th></tr></thead><tbody><tr><td><strong>Cloud Monitoring</strong></td><td>Metrics, dashboards, alerts, uptime checks</td></tr><tr><td><strong>Cloud Logging</strong></td><td>Log collection, sinks, log-based metrics</td></tr><tr><td><strong>Cloud Trace</strong></td><td>Distributed tracing for latency</td></tr><tr><td><strong>Cloud Profiler</strong></td><td>CPU/memory profiling in production</td></tr><tr><td><strong>Error Reporting</strong></td><td>Aggregate and track errors</td></tr></tbody></table><ul><li><strong>SLIs:</strong> What you measure (latency, error rate, throughput)</li><li><strong>SLOs:</strong> Your target (99.9% availability)</li><li><strong>SLAs:</strong> Your contract with users (99.5% with penalties)</li><li><strong>Error budgets:</strong> How much failure you can tolerate (100% - SLO)</li></ul>'}
  ]},
  optimization:{title:'Cost & Optimization (18%)',description:'Analyzing costs and optimizing technical processes.',cards:[
    {id:'pca-cost',name:'Cost Optimization Strategies',content:'<h3>Compute cost levers</h3><table class="study-table"><thead><tr><th>Strategy</th><th>Savings</th><th>Trade-off</th></tr></thead><tbody><tr><td><strong>Committed Use Discounts (CUD)</strong></td><td>Up to 57%</td><td>1-3 year commitment</td></tr><tr><td><strong>Sustained Use Discounts</strong></td><td>Up to 30%</td><td>Automatic for Compute Engine</td></tr><tr><td><strong>Spot/Preemptible VMs</strong></td><td>Up to 91%</td><td>Can be terminated anytime</td></tr><tr><td><strong>Right-sizing</strong></td><td>Varies</td><td>Use Recommender to find oversized VMs</td></tr><tr><td><strong>Serverless</strong></td><td>Pay per use</td><td>Less control</td></tr></tbody></table><h3>Storage cost levers</h3><ul><li>GCS lifecycle policies (auto-transition to cheaper classes)</li><li>BigQuery long-term storage (auto 50% discount after 90 days)</li><li>BigQuery editions: on-demand vs flat-rate</li></ul><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"Predictable workload, reduce cost" &rarr; <strong>CUDs</strong>. "Fault-tolerant batch" &rarr; <strong>Spot VMs</strong>. "Variable traffic" &rarr; <strong>Serverless (Cloud Run)</strong>.</p></div>'},
    {id:'pca-billing',name:'Billing & Resource Management',content:'<h3>Key tools</h3><ul><li><strong>Billing accounts:</strong> Link to projects, set budgets and alerts</li><li><strong>Billing export to BigQuery:</strong> Analyze costs with SQL</li><li><strong>Budgets & alerts:</strong> Notify at 50%, 90%, 100% of budget</li><li><strong>Quotas:</strong> Prevent accidental overspend</li><li><strong>Labels:</strong> Tag resources for cost allocation (team, env, project)</li><li><strong>Recommender:</strong> Right-sizing, idle resource detection</li></ul>'},
    {id:'pca-process',name:'Business Process Optimization',content:'<h3>Topics the exam tests</h3><ul><li><strong>Build vs buy:</strong> When to use managed services vs custom solutions</li><li><strong>TCO analysis:</strong> Total cost of ownership (on-prem vs cloud)</li><li><strong>FinOps:</strong> Financial operations — continuous cost optimization culture</li><li><strong>Technical debt:</strong> When to modernize vs maintain</li><li><strong>Development velocity:</strong> CI/CD, IaC, GitOps improve delivery speed</li></ul>'}
  ]},
  migration:{title:'Migration & Implementation',description:'Moving workloads to GCP and managing deployments.',cards:[
    {id:'pca-migration',name:'Migration Strategies',content:'<h3>The 6 Rs of Migration</h3><table class="study-table"><thead><tr><th>Strategy</th><th>What</th><th>When</th></tr></thead><tbody><tr><td><strong>Rehost</strong> (lift & shift)</td><td>Move as-is to VMs</td><td>Quick win, minimal changes</td></tr><tr><td><strong>Replatform</strong></td><td>Minor adjustments (e.g., managed DB)</td><td>Easy optimizations</td></tr><tr><td><strong>Refactor</strong></td><td>Re-architect for cloud-native</td><td>Long-term value, most effort</td></tr><tr><td><strong>Repurchase</strong></td><td>Switch to SaaS</td><td>Replace custom with commercial</td></tr><tr><td><strong>Retain</strong></td><td>Keep on-prem</td><td>Can\'t move yet (compliance, dependency)</td></tr><tr><td><strong>Retire</strong></td><td>Decommission</td><td>No longer needed</td></tr></tbody></table><h3>GCP Migration tools</h3><ul><li><strong>Migrate to VMs:</strong> Lift & shift VMs from on-prem/AWS/Azure</li><li><strong>Migrate to Containers:</strong> Modernize VMs to containers</li><li><strong>Database Migration Service:</strong> MySQL/PostgreSQL to Cloud SQL</li><li><strong>Transfer Appliance:</strong> Physical device for petabyte-scale data</li><li><strong>BigQuery Data Transfer:</strong> SaaS data to BigQuery</li></ul>'},
    {id:'pca-cicd',name:'CI/CD & IaC',content:'<h3>Deployment tools</h3><ul><li><strong>Cloud Build:</strong> CI/CD pipelines (build, test, deploy)</li><li><strong>Cloud Deploy:</strong> Continuous delivery to GKE/Cloud Run</li><li><strong>Artifact Registry:</strong> Store container images, packages</li><li><strong>Terraform:</strong> Infrastructure as Code (you already know this)</li></ul><h3>Deployment strategies</h3><table class="study-table"><thead><tr><th>Strategy</th><th>Risk</th><th>Rollback</th></tr></thead><tbody><tr><td><strong>Rolling update</strong></td><td>Low</td><td>Roll back to previous version</td></tr><tr><td><strong>Blue/Green</strong></td><td>Low</td><td>Switch traffic back to blue</td></tr><tr><td><strong>Canary</strong></td><td>Lowest</td><td>Route 100% back to stable</td></tr><tr><td><strong>Recreate</strong></td><td>High (downtime)</td><td>Redeploy previous version</td></tr></tbody></table><div class="exam-tip"><div class="exam-tip__label">Exam Shortcut</div><p>"Zero-downtime deploy" &rarr; <strong>Blue/Green or Canary</strong>. "Test with small % of traffic" &rarr; <strong>Canary</strong>.</p></div>'},
    {id:'pca-devops',name:'SRE & DevOps Practices',content:'<h3>Key concepts</h3><ul><li><strong>SLI/SLO/SLA:</strong> Measure &rarr; target &rarr; contract</li><li><strong>Error budgets:</strong> When budget is spent, freeze deployments and fix reliability</li><li><strong>Toil reduction:</strong> Automate repetitive ops work</li><li><strong>Blameless postmortems:</strong> Learn from incidents without blame</li><li><strong>Chaos engineering:</strong> Intentionally break things to find weaknesses</li></ul>'}
  ]},
  cases:{title:'4 Case Studies',description:'20-30% of exam questions reference these case studies. They are published in advance — study them.',cards:[
    {id:'pca-ehr',name:'EHR Healthcare',content:'<h3>Scenario</h3><p>Electronic health record provider. Multi-national medical offices, hospitals, insurance. Software-as-a-Service.</p><h3>Key requirements</h3><ul><li><strong>HIPAA compliance</strong> — PHI must be protected</li><li>High availability for patient data</li><li>Secure connectivity from on-prem hospitals</li><li>Data analytics on health records</li></ul><h3>Architecture decisions</h3><ul><li><strong>Cloud SQL</strong> for patient records (relational, HIPAA-eligible)</li><li><strong>Dedicated Interconnect</strong> for hospital connectivity</li><li><strong>VPC Service Controls</strong> for data perimeter</li><li><strong>Cloud KMS (CMEK)</strong> for PHI encryption</li><li><strong>Identity-Aware Proxy</strong> for secure app access</li><li><strong>Cloud Audit Logs</strong> for HIPAA audit trail</li><li><strong>Assured Workloads</strong> for compliance controls</li></ul>'},
    {id:'pca-hrl',name:'Helicopter Racing League',content:'<h3>Scenario</h3><p>Global sports league. Live streaming of races worldwide with telemetry and real-time predictions.</p><h3>Key requirements</h3><ul><li>Global video delivery with low latency</li><li>Real-time telemetry and ML predictions during races</li><li>Seasonal traffic spikes (championship events)</li></ul><h3>Architecture decisions</h3><ul><li><strong>Media CDN + Cloud Storage</strong> for global video delivery</li><li><strong>Pub/Sub + Dataflow</strong> for real-time telemetry processing</li><li><strong>Vertex AI</strong> for race prediction models</li><li><strong>BigQuery</strong> for historical analytics</li><li><strong>Global External Application LB</strong> for traffic distribution</li><li><strong>Cloud Run</strong> for API serving (scales with events)</li></ul>'},
    {id:'pca-mountkirk',name:'Mountkirk Games',content:'<h3>Scenario</h3><p>Online multiplayer game company. Building a new game backend that needs global reach and massive scale.</p><h3>Key requirements</h3><ul><li>Global multiplayer with low latency</li><li>Scale from 0 to millions of players</li><li>Game state persistence</li><li>Analytics on player behavior</li></ul><h3>Architecture decisions</h3><ul><li><strong>GKE Autopilot</strong> for game servers (auto-scaling, global)</li><li><strong>Spanner</strong> for game state (global, strong consistency)</li><li><strong>Memorystore (Redis)</strong> for session cache</li><li><strong>BigQuery</strong> for player analytics</li><li><strong>Pub/Sub</strong> for event-driven game events</li><li><strong>Cloud CDN</strong> for static game assets</li></ul>'},
    {id:'pca-terramearth',name:'TerramEarth',content:'<h3>Scenario</h3><p>Heavy equipment manufacturer with IoT sensors. Vehicles transmit telemetry data. Needs predictive maintenance.</p><h3>Key requirements</h3><ul><li>Massive IoT data ingestion (disconnected vehicles)</li><li>Predictive maintenance using ML</li><li>Dashboard for fleet management</li><li>Edge processing (vehicles often offline)</li></ul><h3>Architecture decisions</h3><ul><li><strong>Pub/Sub</strong> for telemetry ingestion when connected</li><li><strong>Cloud Storage</strong> for batch uploads when offline</li><li><strong>Dataflow</strong> for stream/batch processing</li><li><strong>BigQuery</strong> for analytics and dashboards</li><li><strong>Vertex AI</strong> for predictive maintenance models</li><li><strong>Bigtable</strong> for real-time telemetry lookups</li><li><strong>Looker</strong> for fleet management dashboards</li></ul>'}
  ]},
  resources:{title:'Practice Exams & Courses',description:'Resources to prepare for the GCP Professional Cloud Architect exam.',cards:[
    {id:'pca-r-official',name:'Official Resources',content:'<h3>From Google Cloud</h3><a class="resource-link" href="https://cloud.google.com/learn/certification/cloud-architect" target="_blank">Certification Page</a> <a class="resource-link" href="https://cloud.google.com/learn/certification/guides/professional-cloud-architect" target="_blank">Exam Guide</a> <a class="resource-link" href="https://www.cloudskillsboost.google/paths/12" target="_blank">Cloud Architect Learning Path</a> <a class="resource-link" href="https://cloud.google.com/architecture/framework" target="_blank">Well-Architected Framework</a>'},
    {id:'pca-r-practice',name:'Free Practice Exams',content:'<a class="resource-link" href="https://open-exam-prep.com/practice/gcp-cloud-architect" target="_blank">OpenExamPrep (Free)</a> <a class="resource-link" href="https://gcppcatest.com/" target="_blank">GCP PCA Test (Free, Unlimited)</a> <a class="resource-link" href="https://certificationpractice.com/practice-exams/google-cloud-professional-cloud-architect" target="_blank">CertificationPractice (Free)</a> <a class="resource-link" href="https://www.examcert.app/blog/gcp-pca-practice-test-2026/" target="_blank">ExamCert (Free Sample)</a>'},
    {id:'pca-r-paid',name:'Paid Courses & Tests',content:'<a class="resource-link" href="https://www.udemy.com/course/google-cloud-professional-cloud-architect-practice-tests-2026/" target="_blank">Udemy: 6 Practice Exams (2026)</a> <a class="resource-link" href="https://www.coursera.org/professional-certificates/gcp-cloud-architect" target="_blank">Coursera: Cloud Architect Certificate</a>'},
    {id:'pca-r-casestudies',name:'Case Study Deep Dives',content:'<a class="resource-link" href="https://nicheelab.com/en/articles/gcp/pca-case-study-guide/" target="_blank">PCA Case Study Guide (2026)</a> <a class="resource-link" href="https://examapp.io/courses/free-case-studies-google-cloud-professional-cloud-architect/" target="_blank">Free Case Studies (ExamApp)</a> <a class="resource-link" href="https://mashutosh20.medium.com/solution-case-studies-gcp-professional-cloud-architect-cd85824c83c8" target="_blank">Case Study Solutions (Medium)</a>'}
  ]}
};

var STORAGE_KEY='gcp-pca-study-progress';var checkedItems={};
var API_URL='http://localhost:8000/api';
function loadProgress(){
  return fetch(API_URL+'/progress/'+STORAGE_KEY).then(function(r){return r.json();}).then(function(d){
    checkedItems=d.progress||{};try{localStorage.setItem(STORAGE_KEY,JSON.stringify(checkedItems));}catch(e){}
  }).catch(function(){try{var s=localStorage.getItem(STORAGE_KEY);if(s)checkedItems=JSON.parse(s);}catch(e){}});
}
function saveProgress(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(checkedItems));}catch(e){}
  fetch(API_URL+'/progress/'+STORAGE_KEY,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({progress:checkedItems})}).catch(function(){});
}
function getCheckedCount(){var c=0;for(var k in checkedItems)if(checkedItems[k])c++;return c;}
function getTotalCount(){var t=0;for(var s in data)t+=data[s].cards.length;return t;}
var contentEl=document.getElementById('content'),titleEl=document.getElementById('sectionTitle'),progressText=document.getElementById('progressText'),progressFill=document.getElementById('progressFill');
function updateProgress(){var checked=getCheckedCount(),total=getTotalCount(),pct=total>0?Math.round((checked/total)*100):0;progressText.textContent=checked+' / '+total;progressFill.style.width=pct+'%';document.querySelectorAll('.sidebar__link').forEach(function(l){var s=l.dataset.section;if(!s||!data[s])return;var dot=l.querySelector('.sidebar__link-dot'),cards=data[s].cards,sc=cards.filter(function(c){return checkedItems[c.id];}).length,cnt=l.querySelector('.sidebar__link-count');if(cnt)cnt.textContent=sc+'/'+cards.length;dot.className='sidebar__link-dot';if(sc===cards.length)dot.classList.add('sidebar__link-dot--done');else if(sc>0)dot.classList.add('sidebar__link-dot--active');});}
function renderSection(key){var section=data[key];if(!section)return;titleEl.textContent=section.title;var html='<h2 class="study-section__title">'+section.title+'</h2><p class="study-section__desc">'+section.description+'</p>';section.cards.forEach(function(card){var isChecked=checkedItems[card.id]||false;html+='<div class="study-card'+(isChecked?' checked':'')+'" data-id="'+card.id+'"><div class="study-card__header"><div class="study-card__header-left"><input type="checkbox" class="study-card__checkbox" '+(isChecked?'checked':'')+' data-id="'+card.id+'"><span class="study-card__name">'+card.name+'</span></div><span class="study-card__arrow">&#9660;</span></div><div class="study-card__body">'+card.content+'</div></div>';});contentEl.innerHTML=html;document.querySelectorAll('.study-card__header').forEach(function(h){h.addEventListener('click',function(e){if(e.target.classList.contains('study-card__checkbox'))return;this.parentElement.classList.toggle('open');});});document.querySelectorAll('.study-card__checkbox').forEach(function(cb){cb.addEventListener('change',function(e){e.stopPropagation();checkedItems[this.dataset.id]=this.checked;saveProgress();updateProgress();var card=this.closest('.study-card');if(this.checked)card.classList.add('checked');else card.classList.remove('checked');});});document.querySelectorAll('.sidebar__link').forEach(function(l){l.classList.remove('active');if(l.dataset.section===key)l.classList.add('active');});}
document.querySelectorAll('.sidebar__link').forEach(function(link){var s=link.dataset.section;if(s&&data[s]){var span=document.createElement('span');span.className='sidebar__link-count';span.textContent='0/'+data[s].cards.length;link.appendChild(span);}link.addEventListener('click',function(e){e.preventDefault();if(this.dataset.section)renderSection(this.dataset.section);document.getElementById('sidebar').classList.remove('open');});});
document.getElementById('expandAll').addEventListener('click',function(){document.querySelectorAll('.study-card').forEach(function(c){c.classList.add('open');});});
document.getElementById('collapseAll').addEventListener('click',function(){document.querySelectorAll('.study-card').forEach(function(c){c.classList.remove('open');});});
document.getElementById('sidebarToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open');});
loadProgress().then(function(){renderSection('design');updateProgress();});
})();
</script>
</body>
