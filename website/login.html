<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Hub — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root{--bg-primary:#0a0e17;--bg-secondary:#111827;--bg-tertiary:#1f2937;--accent-primary:#06b6d4;--accent-secondary:#3b82f6;--accent-gradient:linear-gradient(135deg,#06b6d4,#3b82f6);--status-complete:#10b981;--status-gap:#ef4444;--text-primary:#f9fafb;--text-secondary:#9ca3af;--text-muted:#6b7280;--border-subtle:#1f2937;--font-body:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono','Fira Code',monospace}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .login-container{width:100%;max-width:400px;padding:2rem}
    .login-card{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:16px;padding:2.5rem}
    .login-card__logo{font-family:var(--font-mono);font-size:2rem;font-weight:700;text-align:center;margin-bottom:.5rem}
    .login-card__logo span{color:var(--accent-primary)}
    .login-card__subtitle{text-align:center;color:var(--text-muted);font-size:.85rem;margin-bottom:2rem}
    .tabs{display:flex;gap:0;margin-bottom:2rem;background:var(--bg-tertiary);border-radius:8px;padding:4px}
    .tab{flex:1;padding:.5rem;text-align:center;font-size:.85rem;font-weight:500;color:var(--text-muted);cursor:pointer;border-radius:6px;border:none;background:none;transition:all .2s}
    .tab.active{background:var(--accent-gradient);color:var(--bg-primary);font-weight:600}
    .form-group{margin-bottom:1.25rem}
    .form-group label{display:block;font-size:.8rem;color:var(--text-secondary);margin-bottom:.4rem;font-family:var(--font-mono)}
    .form-group input{width:100%;padding:.7rem 1rem;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:8px;color:var(--text-primary);font-family:var(--font-body);font-size:.9rem;outline:none;transition:border-color .2s}
    .form-group input:focus{border-color:var(--accent-primary)}
    .btn-submit{width:100%;padding:.75rem;background:var(--accent-gradient);color:var(--bg-primary);border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;margin-top:.5rem}
    .btn-submit:hover{box-shadow:0 0 20px rgba(6,182,212,.3);transform:translateY(-1px)}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .message{text-align:center;font-size:.8rem;margin-top:1rem;padding:.5rem;border-radius:6px}
    .message--error{background:rgba(239,68,68,.1);color:var(--status-gap)}
    .message--success{background:rgba(16,185,129,.1);color:var(--status-complete)}
    .back-link{display:block;text-align:center;margin-top:1.5rem;color:var(--text-muted);font-size:.8rem;text-decoration:none}
    .back-link:hover{color:var(--accent-primary)}
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-card__logo">RL<span>.</span> Study Hub</div>
      <p class="login-card__subtitle">Sign in to sync your progress across devices</p>

      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="showTab('login')">Sign In</button>
        <button class="tab" id="tabRegister" onclick="showTab('register')">Register</button>
      </div>

      <form id="authForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="Your password" minlength="6" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
      </form>

      <div id="message" class="message" style="display:none"></div>
      <a href="index.html" class="back-link">&larr; Back to Portfolio</a>
    </div>
  </div>

  <script>
  (function() {
    var API_URL = 'https://studyhub-api-881000472963.southamerica-east1.run.app/api';
    var mode = 'login';

    // If already logged in, redirect
    var token = localStorage.getItem('studyhub_token');
    if (token) {
      var redirect = new URLSearchParams(window.location.search).get('redirect') || 'gcp-architect-study.html';
      window.location.href = redirect;
    }

    window.showTab = function(tab) {
      mode = tab;
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('submitBtn').textContent = tab === 'login' ? 'Sign In' : 'Create Account';
      document.getElementById('message').style.display = 'none';
    };

    window.handleSubmit = function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value;
      var password = document.getElementById('password').value;
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('message');

      btn.disabled = true;
      btn.textContent = 'Loading...';

      var endpoint = mode === 'login' ? '/auth/login' : '/auth/register';

      fetch(API_URL + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      })
      .then(function(r) {
        if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || 'Error'); });
        return r.json();
      })
      .then(function(data) {
        localStorage.setItem('studyhub_token', data.token);
        localStorage.setItem('studyhub_email', data.email);
        msg.className = 'message message--success';
        msg.textContent = 'Success! Redirecting...';
        msg.style.display = 'block';
        setTimeout(function() {
          var redirect = new URLSearchParams(window.location.search).get('redirect') || 'gcp-architect-study.html';
          window.location.href = redirect;
        }, 500);
      })
      .catch(function(err) {
        msg.className = 'message message--error';
        msg.textContent = err.message;
        msg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
      });
    };
  })();
  </script>
</body>
</html>
