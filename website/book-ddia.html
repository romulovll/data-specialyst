<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDIA — Book Learning System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root{--bg-primary:#0a0e17;--bg-secondary:#111827;--bg-tertiary:#1f2937;--accent-primary:#e11d48;--accent-secondary:#f43f5e;--accent-gradient:linear-gradient(135deg,#e11d48,#f97316);--status-complete:#10b981;--status-in-progress:#f59e0b;--status-planned:#6b7280;--text-primary:#f9fafb;--text-secondary:#9ca3af;--text-muted:#6b7280;--border-subtle:#1f2937;--font-body:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono','Fira Code',monospace}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased}
    .app{display:flex;min-height:100vh}
    .sidebar{width:300px;background:var(--bg-secondary);border-right:1px solid var(--border-subtle);position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:50}
    .sidebar__header{padding:1.25rem;border-bottom:1px solid var(--border-subtle)}
    .sidebar__title{font-size:.95rem;font-weight:700}.sidebar__book{font-size:.7rem;color:var(--text-muted);font-family:var(--font-mono)}
    .sidebar__progress{margin-top:.75rem}.sidebar__progress-text{display:flex;justify-content:space-between;font-size:.75rem;color:var(--text-muted);margin-bottom:.35rem;font-family:var(--font-mono)}
    .sidebar__progress-bar{height:6px;background:var(--bg-tertiary);border-radius:3px;overflow:hidden}.sidebar__progress-fill{height:100%;background:var(--accent-gradient);border-radius:3px;transition:width .5s ease}
    .sidebar__nav{padding:.5rem 0}
    .sidebar__section-title{font-size:.6rem;font-family:var(--font-mono);color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;padding:.75rem 1.25rem .25rem}
    .sidebar__link{display:flex;align-items:center;gap:.5rem;padding:.4rem 1.25rem;color:var(--text-secondary);text-decoration:none;font-size:.75rem;transition:all .2s;border-left:2px solid transparent;cursor:pointer;background:none;border-right:none;border-top:none;border-bottom:none;width:100%;text-align:left}
    .sidebar__link:hover{color:var(--text-primary);background:rgba(225,29,72,.05)}.sidebar__link.active{color:var(--accent-primary);border-left-color:var(--accent-primary);background:rgba(225,29,72,.08)}
    .sidebar__link-dot{width:6px;height:6px;border-radius:50%;background:var(--status-planned);flex-shrink:0}.sidebar__link-dot--done{background:var(--status-complete)}.sidebar__link-dot--active{background:var(--status-in-progress)}
    .sidebar__link-count{margin-left:auto;font-family:var(--font-mono);font-size:.6rem;color:var(--text-muted)}
    .sidebar__footer{padding:.75rem 1.25rem;border-top:1px solid var(--border-subtle);font-size:.75rem}.sidebar__footer a{color:var(--accent-primary);text-decoration:none}
    .sidebar-toggle{display:none;position:fixed;bottom:1.5rem;right:1.5rem;z-index:60;width:48px;height:48px;border-radius:50%;background:var(--accent-gradient);border:none;color:white;font-size:1.2rem;cursor:pointer;box-shadow:0 4px 15px rgba(225,29,72,.3);align-items:center;justify-content:center}
    .main{margin-left:300px;flex:1;min-width:0}
    .main__header{position:sticky;top:0;z-index:40;background:rgba(10,14,23,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between}
    .main__header h1{font-size:1rem;font-weight:600}
    /* Tabs */
    .mode-tabs{display:flex;gap:0;background:var(--bg-tertiary);border-radius:8px;padding:3px;margin-bottom:1.5rem}
    .mode-tab{flex:1;padding:.5rem;text-align:center;font-size:.75rem;font-weight:500;color:var(--text-muted);cursor:pointer;border-radius:6px;border:none;background:none;transition:all .2s;font-family:var(--font-mono)}
    .mode-tab.active{background:var(--accent-gradient);color:white;font-weight:600}
    .content{padding:2rem;max-width:900px}
    .section-title{font-size:1.3rem;font-weight:700;margin-bottom:.5rem;background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
    .section-desc{color:var(--text-muted);font-size:.85rem;margin-bottom:1.5rem}
    /* Cards */
    .card{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:12px;margin-bottom:1rem;overflow:hidden}
    .card__header{padding:1rem 1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .2s}
    .card__header:hover{background:rgba(225,29,72,.03)}
    .card__header-left{display:flex;align-items:center;gap:.75rem}
    .card__checkbox{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--border-subtle);border-radius:4px;cursor:pointer;position:relative;flex-shrink:0;transition:all .2s}
    .card__checkbox:checked{background:var(--status-complete);border-color:var(--status-complete)}
    .card__checkbox:checked::after{content:'\2713';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:.65rem;font-weight:700}
    .card__name{font-size:.88rem;font-weight:600}
    .card.checked .card__name{color:var(--status-complete);text-decoration:line-through;opacity:.7}
    .card__arrow{color:var(--text-muted);font-size:.75rem;transition:transform .3s}
    .card.open .card__arrow{transform:rotate(180deg)}
    .card__body{display:none;padding:0 1.25rem 1.25rem;border-top:1px solid var(--border-subtle)}.card.open .card__body{display:block}
    .card__body h3{font-size:.85rem;font-weight:600;color:var(--accent-primary);margin:1rem 0 .4rem}.card__body h3:first-child{margin-top:.75rem}
    .card__body p{color:var(--text-secondary);font-size:.82rem;line-height:1.7;margin-bottom:.4rem}
    .card__body strong{color:var(--text-primary)}
    .card__body ul{list-style:none;margin-bottom:.6rem}.card__body ul li{color:var(--text-secondary);font-size:.82rem;line-height:1.5;padding-left:.9rem;position:relative;margin-bottom:.25rem}
    .card__body ul li::before{content:'';position:absolute;left:0;top:.5rem;width:4px;height:4px;border-radius:50%;background:var(--accent-primary)}
    .card__body table{width:100%;border-collapse:collapse;margin:.6rem 0;font-size:.78rem}
    .card__body th{text-align:left;padding:.4rem .6rem;background:var(--bg-tertiary);color:var(--accent-primary);font-family:var(--font-mono);font-weight:500;font-size:.7rem;border-bottom:1px solid var(--border-subtle)}
    .card__body td{padding:.4rem .6rem;color:var(--text-secondary);border-bottom:1px solid rgba(31,41,55,.5)}
    .card__body pre{background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:8px;padding:.75rem;margin:.6rem 0;font-family:var(--font-mono);font-size:.73rem;color:var(--accent-primary);overflow-x:auto;line-height:1.4;white-space:pre}
    /* Flashcard */
    .flashcard{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:12px;padding:1.5rem;margin-bottom:1rem;cursor:pointer;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;transition:all .3s}
    .flashcard:hover{border-color:var(--accent-primary)}
    .flashcard__front{font-size:.95rem;font-weight:600}.flashcard__back{display:none;font-size:.85rem;color:var(--text-secondary);line-height:1.6}
    .flashcard.flipped .flashcard__front{display:none}.flashcard.flipped .flashcard__back{display:block}
    .flashcard__hint{font-family:var(--font-mono);font-size:.65rem;color:var(--text-muted);margin-top:.75rem}
    .fc-controls{display:flex;gap:.5rem;justify-content:center;margin-bottom:1.5rem}
    .fc-btn{padding:.4rem 1rem;border-radius:6px;border:1px solid var(--border-subtle);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;font-size:.8rem;transition:all .2s}
    .fc-btn:hover{border-color:var(--accent-primary);color:var(--text-primary)}
    .fc-btn--know{border-color:rgba(16,185,129,.3);color:var(--status-complete)}.fc-btn--hard{border-color:rgba(225,29,72,.3);color:var(--accent-primary)}
    /* Quiz */
    .quiz-q{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
    .quiz-q__text{font-size:.9rem;font-weight:600;margin-bottom:.75rem}
    .quiz-q__options{display:flex;flex-direction:column;gap:.4rem}
    .quiz-opt{padding:.6rem .9rem;border:1px solid var(--border-subtle);border-radius:8px;cursor:pointer;font-size:.82rem;color:var(--text-secondary);transition:all .2s;background:var(--bg-tertiary)}
    .quiz-opt:hover{border-color:var(--accent-primary);color:var(--text-primary)}
    .quiz-opt.correct{border-color:var(--status-complete);background:rgba(16,185,129,.1);color:var(--status-complete)}
    .quiz-opt.wrong{border-color:var(--accent-primary);background:rgba(225,29,72,.1);color:var(--accent-primary)}
    .quiz-opt.disabled{pointer-events:none}
    .quiz-explain{margin-top:.6rem;padding:.6rem;background:rgba(16,185,129,.05);border-radius:6px;font-size:.78rem;color:var(--text-secondary);display:none}
    /* Memory Palace */
    .palace-room{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
    .palace-room__name{font-size:.9rem;font-weight:600;margin-bottom:.5rem;color:var(--accent-primary)}
    .palace-room__desc{font-size:.82rem;color:var(--text-secondary);margin-bottom:.6rem;font-style:italic}
    .palace-room__items{display:flex;flex-direction:column;gap:.4rem}
    .palace-item{display:flex;gap:.6rem;font-size:.8rem;padding:.4rem .6rem;background:var(--bg-tertiary);border-radius:6px}
    .palace-item__object{font-weight:600;color:var(--text-primary);min-width:120px}
    .palace-item__concept{color:var(--text-secondary)}
    /* Scenario */
    .scenario{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
    .scenario__context{font-size:.85rem;color:var(--text-secondary);margin-bottom:.75rem;line-height:1.6;border-left:3px solid var(--accent-primary);padding-left:.75rem}
    .scenario__question{font-size:.9rem;font-weight:600;margin-bottom:.5rem}
    .scenario__answer{display:none;margin-top:.75rem;padding:.75rem;background:rgba(16,185,129,.05);border-radius:8px;font-size:.82rem;color:var(--text-secondary);line-height:1.6}
    .scenario__toggle{font-size:.75rem;color:var(--accent-primary);cursor:pointer;font-family:var(--font-mono);border:none;background:none;padding:0}
    .tip{background:rgba(245,158,11,.08);border-left:3px solid #f59e0b;border-radius:0 8px 8px 0;padding:.6rem .85rem;margin:.6rem 0;font-size:.78rem}
    .tip__label{font-family:var(--font-mono);font-size:.65rem;color:#f59e0b;text-transform:uppercase;margin-bottom:.15rem}.tip p{color:var(--text-secondary);margin:0}

    @media(max-width:768px){.sidebar{transform:translateX(-100%);transition:transform .3s}.sidebar.open{transform:translateX(0)}.sidebar-toggle{display:flex}.main{margin-left:0}.content{padding:1.5rem 1rem}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__header">
      <div class="sidebar__title">Book Learning System</div>
      <div class="sidebar__book">Designing Data-Intensive Applications (2nd Ed)</div>
      <div class="sidebar__book">Kleppmann & Riccomini, 2026</div>
      <div class="sidebar__progress"><div class="sidebar__progress-text"><span>Chapters</span><span id="progressText">0 / 13</span></div><div class="sidebar__progress-bar"><div class="sidebar__progress-fill" id="progressFill" style="width:0%"></div></div></div>
    </div>
    <nav class="sidebar__nav" id="sidebarNav">
      <div class="sidebar__section-title">Part I: Foundations</div>
      <button class="sidebar__link active" data-ch="ch1"><span class="sidebar__link-dot"></span>1. Trade-Offs in Data Systems</button>
      <button class="sidebar__link" data-ch="ch2"><span class="sidebar__link-dot"></span>2. Nonfunctional Requirements</button>
      <button class="sidebar__link" data-ch="ch3"><span class="sidebar__link-dot"></span>3. Data Models & Query Languages</button>
      <button class="sidebar__link" data-ch="ch4"><span class="sidebar__link-dot"></span>4. Storage and Retrieval</button>
      <button class="sidebar__link" data-ch="ch5"><span class="sidebar__link-dot"></span>5. Encoding and Evolution</button>
      <div class="sidebar__section-title">Part II: Distributed Data</div>
      <button class="sidebar__link" data-ch="ch6"><span class="sidebar__link-dot"></span>6. Replication</button>
      <button class="sidebar__link" data-ch="ch7"><span class="sidebar__link-dot"></span>7. Partitioning</button>
      <button class="sidebar__link" data-ch="ch8"><span class="sidebar__link-dot"></span>8. Transactions</button>
      <button class="sidebar__link" data-ch="ch9"><span class="sidebar__link-dot"></span>9. Trouble with Distributed Sys</button>
      <button class="sidebar__link" data-ch="ch10"><span class="sidebar__link-dot"></span>10. Consistency and Consensus</button>
      <div class="sidebar__section-title">Part III: Derived Data</div>
      <button class="sidebar__link" data-ch="ch11"><span class="sidebar__link-dot"></span>11. Batch Processing</button>
      <button class="sidebar__link" data-ch="ch12"><span class="sidebar__link-dot"></span>12. Stream Processing</button>
      <button class="sidebar__link" data-ch="ch13"><span class="sidebar__link-dot"></span>13. Doing the Right Thing</button>
    </nav>
    <div class="sidebar__footer">
      <a href="newsletter.html">Newsletter</a> &middot; <a href="gcp-architect-study.html">Study Hub</a> &middot; <a href="index.html">Portfolio</a>
      <br><span id="authStatus"></span>
    </div>
  </aside>
  <button class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
  <div class="main">
    <header class="main__header"><h1 id="chapterTitle">Ch 1: Trade-Offs in Data Systems Architecture</h1></header>
    <div class="content">
      <div class="mode-tabs">
        <button class="mode-tab active" onclick="switchMode('summary')">Summary</button>
        <button class="mode-tab" onclick="switchMode('flashcards')">Flashcards</button>
        <button class="mode-tab" onclick="switchMode('quiz')">Quiz</button>
        <button class="mode-tab" onclick="switchMode('palace')">Memory Palace</button>
        <button class="mode-tab" onclick="switchMode('scenarios')">Scenarios</button>
        <button class="mode-tab" onclick="switchMode('gcpmap')">GCP Map</button>
      </div>
      <div id="modeContent"></div>
    </div>
  </div>
</div>
<script src="js/auth.js"></script>
<script src="js/ddia-data.js"></script>
<script>
(function(){
var STORAGE_KEY='ddia-book-progress';var checkedItems={};
function loadProgress(){return loadProgressFromAPI(STORAGE_KEY)}
function saveProgress(){saveProgressToAPI(STORAGE_KEY)}

var chapters = DDIA_CHAPTERS;

var currentCh='ch1';var currentMode='summary';

function switchMode(mode){
  currentMode=mode;
  document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
  event.target.classList.add('active');
  renderContent();
}
window.switchMode=switchMode;

function renderContent(){
  var ch=chapters[currentCh];if(!ch)return;
  document.getElementById('chapterTitle').textContent=ch.title;
  var el=document.getElementById('modeContent');
  var html='';

  if(currentMode==='summary'){
    html='<h2 class="section-title">Chapter Summary</h2><p class="section-desc">Key concepts and trade-offs — 5 min read</p>';
    ch.summary.forEach(function(s){
      var isChecked=checkedItems[s.id]||false;
      html+='<div class="card'+(isChecked?' checked':'')+'" data-id="'+s.id+'"><div class="card__header"><div class="card__header-left"><input type="checkbox" class="card__checkbox" '+(isChecked?'checked':'')+' data-id="'+s.id+'"><span class="card__name">'+s.name+'</span></div><span class="card__arrow">&#9660;</span></div><div class="card__body">'+s.content+'</div></div>';
    });
  } else if(currentMode==='flashcards'){
    html='<h2 class="section-title">Flashcards</h2><p class="section-desc">Click to flip. Review at increasing intervals for maximum retention.</p><div class="fc-controls"><button class="fc-btn" onclick="prevCard()">&#9664; Prev</button><button class="fc-btn fc-btn--hard" onclick="nextCard()">Hard (see again soon)</button><button class="fc-btn fc-btn--know" onclick="nextCard()">Got it &#10003;</button></div>';
    html+='<div id="fcContainer"></div><p style="text-align:center;font-family:var(--font-mono);font-size:.75rem;color:var(--text-muted)" id="fcCounter"></p>';
  } else if(currentMode==='quiz'){
    html='<h2 class="section-title">Quiz</h2><p class="section-desc">Test your understanding — active recall is 3x more effective than re-reading.</p>';
    ch.quiz.forEach(function(q,i){
      html+='<div class="quiz-q"><div class="quiz-q__text">'+(i+1)+'. '+q.q+'</div><div class="quiz-q__options">';
      q.opts.forEach(function(opt,j){
        html+='<div class="quiz-opt" data-qi="'+i+'" data-oi="'+j+'" onclick="checkAnswer('+i+','+j+')">'+String.fromCharCode(65+j)+'. '+opt+'</div>';
      });
      html+='</div><div class="quiz-explain" id="explain-'+i+'">'+q.explain+'</div></div>';
    });
  } else if(currentMode==='palace'){
    html='<h2 class="section-title">Memory Palace</h2><p class="section-desc">Walk through your house. Each room holds a concept. Spatial memory is the strongest human memory system.</p>';
    ch.palace.forEach(function(r){
      html+='<div class="palace-room"><div class="palace-room__name">&#127968; '+r.room+'</div><div class="palace-room__desc">"'+r.desc+'"</div><div class="palace-room__items">';
      r.items.forEach(function(it){
        html+='<div class="palace-item"><span class="palace-item__object">'+it.obj+' &rarr;</span><span class="palace-item__concept">'+it.concept+'</span></div>';
      });
      html+='</div></div>';
    });
  } else if(currentMode==='scenarios'){
    html='<h2 class="section-title">Real-World Scenarios</h2><p class="section-desc">Architecture decisions based on this chapter. Think before revealing the answer.</p>';
    ch.scenarios.forEach(function(s,i){
      html+='<div class="scenario"><div class="scenario__context">'+s.context+'</div><div class="scenario__question">'+s.question+'</div><button class="scenario__toggle" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'block\'?\'none\':\'block\'">Show Answer &#9660;</button><div class="scenario__answer">'+s.answer+'</div></div>';
    });
  } else if(currentMode==='gcpmap'){
    html='<h2 class="section-title">GCP Mapping</h2><p class="section-desc">Every book concept mapped to a GCP service you use at work.</p><table style="width:100%;border-collapse:collapse;font-size:.82rem"><thead><tr><th style="text-align:left;padding:.5rem .75rem;background:var(--bg-tertiary);color:var(--accent-primary);font-family:var(--font-mono);font-size:.72rem;border-bottom:1px solid var(--border-subtle)">Book Concept</th><th style="text-align:left;padding:.5rem .75rem;background:var(--bg-tertiary);color:var(--accent-primary);font-family:var(--font-mono);font-size:.72rem;border-bottom:1px solid var(--border-subtle)">GCP Service</th><th style="text-align:left;padding:.5rem .75rem;background:var(--bg-tertiary);color:var(--accent-primary);font-family:var(--font-mono);font-size:.72rem;border-bottom:1px solid var(--border-subtle)">Why</th></tr></thead><tbody>';
    ch.gcpmap.forEach(function(m){
      html+='<tr><td style="padding:.5rem .75rem;color:var(--text-primary);border-bottom:1px solid rgba(31,41,55,.5);font-weight:600">'+m.concept+'</td><td style="padding:.5rem .75rem;color:var(--text-secondary);border-bottom:1px solid rgba(31,41,55,.5)"><strong>'+m.service+'</strong></td><td style="padding:.5rem .75rem;color:var(--text-muted);border-bottom:1px solid rgba(31,41,55,.5)">'+m.why+'</td></tr>';
    });
    html+='</tbody></table>';
  }

  el.innerHTML=html;

  // Bind events
  if(currentMode==='summary'){
    el.querySelectorAll('.card__header').forEach(function(h){h.addEventListener('click',function(e){if(e.target.classList.contains('card__checkbox'))return;this.parentElement.classList.toggle('open')})});
    el.querySelectorAll('.card__checkbox').forEach(function(cb){cb.addEventListener('change',function(e){e.stopPropagation();checkedItems[this.dataset.id]=this.checked;saveProgress();updateProgress();var card=this.closest('.card');if(this.checked)card.classList.add('checked');else card.classList.remove('checked')})});
  }
  if(currentMode==='flashcards') renderFlashcard();
}

// Flashcard navigation
var fcIndex=0;
function renderFlashcard(){
  var cards=chapters[currentCh].flashcards;if(!cards||!cards.length)return;
  if(fcIndex>=cards.length)fcIndex=0;if(fcIndex<0)fcIndex=cards.length-1;
  var c=cards[fcIndex];
  var el=document.getElementById('fcContainer');
  el.innerHTML='<div class="flashcard" onclick="this.classList.toggle(\'flipped\')"><div class="flashcard__front">'+c.q+'<div class="flashcard__hint">Click to reveal answer</div></div><div class="flashcard__back">'+c.a+'</div></div>';
  document.getElementById('fcCounter').textContent=(fcIndex+1)+' / '+cards.length;
}
window.prevCard=function(){fcIndex--;renderFlashcard()};
window.nextCard=function(){fcIndex++;renderFlashcard()};

// Quiz
window.checkAnswer=function(qi,oi){
  var q=chapters[currentCh].quiz[qi];
  var opts=document.querySelectorAll('[data-qi="'+qi+'"]');
  opts.forEach(function(o){o.classList.add('disabled');if(parseInt(o.dataset.oi)===q.correct)o.classList.add('correct');else if(parseInt(o.dataset.oi)===oi)o.classList.add('wrong')});
  document.getElementById('explain-'+qi).style.display='block';
};

// Progress
function updateProgress(){
  var total=0;var done=0;
  for(var ch in chapters){chapters[ch].summary.forEach(function(s){total++;if(checkedItems[s.id])done++})}
  document.getElementById('progressText').textContent=done+' / '+total;
  document.getElementById('progressFill').style.width=(total>0?Math.round(done/total*100):0)+'%';
}

// Navigation
document.querySelectorAll('.sidebar__link').forEach(function(link){
  link.addEventListener('click',function(){
    currentCh=this.dataset.ch;fcIndex=0;
    document.querySelectorAll('.sidebar__link').forEach(function(l){l.classList.remove('active')});
    this.classList.add('active');
    document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
    document.querySelector('.mode-tab').classList.add('active');
    currentMode='summary';
    renderContent();
    document.getElementById('sidebar').classList.remove('open');
  });
});

document.getElementById('sidebarToggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});

loadProgress().then(function(){renderContent();updateProgress()});
})();
</script>
</body>
</html>
